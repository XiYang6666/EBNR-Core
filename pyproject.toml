[project]
name = "EBNR-Core"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "XiYang6666", email = "1782356858@qq.com"},
]
dependencies = ["httpx[http2]>=0.28.1", "cryptography>=49.0.0"]
requires-python = ">=3.12,<3.15"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm.scripts]
test = "pytest"
format = "ruff check --fix ./src ./tests"

[tool.pdm]
distribution = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "pytest-asyncio>=1.4.0",
]
